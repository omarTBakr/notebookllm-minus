[pytest]
# src/ is the import root: every module says `from routes import ...`, never
# `from src.routes import ...`, and template_parser resolves locales through
# importlib at runtime, so the path has to be real.
pythonpath = src
testpaths = test
asyncio_mode = auto
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
