# Test, then restart the systemd unit on the main box.
#
# The unit (notebookllm-minus.service) runs `docker compose up -d --build` in
# the checkout on that machine, so a restart is only a deployment if the
# checkout has moved first — hence the `git pull` below. Drop that line and
# this becomes a pure "bounce the service" button.
#
# Secrets used (repository settings -> Secrets and variables -> Actions):
#   SSH_MAIN_HOST_IP       the box's public IP
#   SSH_MAIN_PRIVATE_KEY   a private key whose public half is in the
#                          remote user's ~/.ssh/authorized_keys
#
# The remote user needs passwordless sudo for exactly the restart, e.g. in
# /etc/sudoers.d/notebookllm:
#   omar ALL=(root) NOPASSWD: /usr/bin/systemctl restart notebookllm-minus
#
# It has to match what runs below character for character — a rule naming
# /bin/systemctl, or "notebookllm-minus.service", does not match and sudo
# falls back to asking for a password that no runner can type. Check it with
#   ssh <user>@<host> 'sudo -n -l'
# which lists exactly what is allowed without one. Only `restart` needs sudo;
# is-active and status are readable by any user.

name: Github-Actions

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. Without this, two quick pushes can have their builds
# interleave on the box, and `compose up --build` is not safe to run twice at
# once against the same project.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REMOTE_USER: omar
  REMOTE_DIR: /home/omar/notebookllm-minus
  SERVICE: notebookllm-minus

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"     # matches requires-python and the image

      - name: install uv
        run: pip install --disable-pip-version-check uv

      # --locked so CI fails loudly if uv.lock drifts from pyproject, which is
      # exactly what broke the image build once already. The project lives in
      # src/, the test suite is rooted at the repo top (pytest.ini), so the
      # environment is built there and the command still runs from here.
      - name: install dependencies
        run: uv sync --locked --project src

      - name: run the test suite
        run: uv run --project src python -m pytest -q

  deploy:
    name: restart the service
    needs: test              # nothing reaches the box unless the suite is green
    # Only the private repo has SSH_MAIN_HOST_IP and SSH_MAIN_PRIVATE_KEY, and
    # secrets do not cross repositories. Without this the public mirror runs
    # this job with empty strings and fails on every single push, which trains
    # everyone to ignore a red tick. There, green after `test` is the honest
    # result: the public repo deploys nothing.
    if: github.repository == 'NotebookLLM-minus/notebookllm-minus'
    runs-on: ubuntu-latest
    timeout-minutes: 30      # `--build` from a cold cache is minutes, not seconds

    steps:
      - name: restart over ssh
        env:
          HOST: ${{ secrets.SSH_MAIN_HOST_IP }}
          SSH_KEY: ${{ secrets.SSH_MAIN_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          # Written once and reused, rather than spelled out at each use: a
          # typo in one of four literal ~/.ssh paths creates a plausible
          # directory, exits 0, and fails two lines later on a redirect.
          KEY_DIR="$HOME/.ssh"
          KEY_FILE="$KEY_DIR/deploy_key"

          install -m 700 -d "$KEY_DIR"
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          # Trust on first use: a GitHub runner is a fresh machine every time,
          # so there is no known_hosts to compare against and pinning a
          # fingerprint here would only move the secret. StrictHostKeyChecking
          # stays on for the session itself.
          if ! ssh-keyscan -T 10 "$HOST" >> "$KEY_DIR/known_hosts" 2>/dev/null \
             || ! [ -s "$KEY_DIR/known_hosts" ]; then
            echo "::error::no host key from $HOST — is the box up, and is port 22" \
                 "open to GitHub's runners? (their IPs are dynamic)"
            exit 1
          fi

          ssh -i "$KEY_FILE" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              "$REMOTE_USER@$HOST" \
              "REMOTE_DIR='$REMOTE_DIR' SERVICE='$SERVICE' bash -euo pipefail -s" <<'REMOTE'
            cd "$REMOTE_DIR"

            # --ff-only: refuse to merge. A box that has drifted should stop
            # the deploy and be looked at, not have a merge commit invented
            # on it by a script nobody is watching.
            git pull --ff-only

            # Absolute path, deliberately: sudoers matches the command as
            # written, so `sudo systemctl` resolved through PATH may or may
            # not equal the /usr/bin/systemctl a NOPASSWD rule names. The
            # rule must spell this identically, argument for argument.
            # `set -e` would abort here on a failed restart, before any of
            # the diagnostics below run — which is exactly what happened on the
            # first Arabic-OCR deploy: the job reported "Job for
            # notebookllm-minus.service failed" and nothing else, and the cause
            # had to be chased by hand. A failed restart is the moment the logs
            # are worth most, so they are collected before exiting.
            if ! sudo -n /usr/bin/systemctl restart "$SERVICE"; then
              echo "::group::journalctl -xeu $SERVICE"
              journalctl -xeu "$SERVICE" --no-pager --lines=80 || true
              echo "::endgroup::"
              echo "::group::disk and memory"
              df -h / /var/lib/docker 2>/dev/null || df -h /
              free -m
              echo "::endgroup::"
              echo "::group::compose state"
              (cd Docker && docker compose ps --all) || true
              echo "::endgroup::"
              echo "::error::$SERVICE failed to restart — see the groups above"
              exit 1
            fi

            # restart returns once ExecStart has finished, but "finished" for a
            # oneshot unit only means compose exited 0 — ask the unit what it
            # thinks, and fail the job if it is not active.
            systemctl is-active --quiet "$SERVICE"
            systemctl --no-pager --lines=20 status "$SERVICE" || true
            (cd Docker && docker compose ps)
          REMOTE

      - name: scrub the key
        if: always()          # including when the deploy failed
        run: shred -u ~/.ssh/deploy_key 2>/dev/null || rm -f ~/.ssh/deploy_key
