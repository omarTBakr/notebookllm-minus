# Read-only look at the running server, from a GitHub runner.
#
# The box's security group admits GitHub's runners and not arbitrary
# addresses, so a runner is the only vantage point that can see it. Nothing
# here writes: no restart, no migration, no credential change. Add to it
# rather than reaching for a shell, so the next person gets the same view.
name: Server diagnostics

on:
  workflow_dispatch:

concurrency:
  group: deploy-main          # never mid-deploy
  cancel-in-progress: false

env:
  REMOTE_USER: omar
  REMOTE_DIR: /home/omar/notebookllm-minus

jobs:
  look:
    name: read the server state
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'NotebookLLM-minus/notebookllm-minus'

    steps:
      - name: gather over ssh
        env:
          HOST: ${{ secrets.SSH_MAIN_HOST_IP }}
          SSH_KEY: ${{ secrets.SSH_MAIN_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.ssh"; KEY_FILE="$KEY_DIR/deploy_key"
          install -m 700 -d "$KEY_DIR"
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"; chmod 600 "$KEY_FILE"
          ssh-keyscan -T 10 "$HOST" >> "$KEY_DIR/known_hosts" 2>/dev/null

          ssh -i "$KEY_FILE" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              "$REMOTE_USER@$HOST" "REMOTE_DIR='$REMOTE_DIR' bash -euo pipefail -s" <<'REMOTE'
            cd "$REMOTE_DIR/Docker"

            # Everything below redirects stdin from /dev/null. The remote
            # script IS stdin (ssh ... bash -s <<'REMOTE'), and `docker compose
            # exec` reads stdin even with -T, so the first one swallowed the
            # rest of this script and the run ended after a single group.
            echo "::group::containers"
            docker compose ps --all < /dev/null
            echo "::endgroup::"

            echo "::group::machine"
            nproc; free -m; uptime
            echo "::endgroup::"

            echo "::group::what OCR would use here"
            # The three bounds that decide the pool, printed from the running
            # image so this reflects the deployed code and not the repo.
            # Every line stays indented: a bare column-0 line inside a YAML
            # block scalar ends the scalar and is parsed as a new key.
            # One line: a column-0 continuation would end the YAML block scalar.
            docker compose exec -T celery-process python -c 'import sys; sys.path.insert(0,"/app"); from controllers.PdfLayoutController import _cpu_count, _available_memory_mb; from controllers import ProcessController; p = ProcessController(); mem = _available_memory_mb(); print("OCR_ENABLED", p.settings.OCR_ENABLED); print("OCR_EXTRACTOR", p.settings.OCR_EXTRACTOR); print("OCR_WORKERS set", p.settings.OCR_WORKERS); print("cpus visible", _cpu_count()); print("memory available MB", None if mem is None else round(mem)); print("workers for a 200-page doc", p._ocr_workers(200))' < /dev/null || echo "(celery-process not running)"
            echo "::endgroup::"

            echo "::group::tesseract present"
            docker compose exec -T celery-process sh -c \
              'tesseract --version 2>&1 | head -2; ls /usr/share/tessdata-best 2>/dev/null' \
              < /dev/null || echo "(unavailable)"
            echo "::endgroup::"

            echo "::group::assets and chunks"
            docker compose exec -T pgvector psql -U postgres -d notebookllm-minus -c \
              "SELECT a.name, a.asset_id, a.project_id,
                      (SELECT count(*) FROM chunks c WHERE c.asset_id = a.asset_id) AS chunks,
                      a.created_at
                 FROM assets a ORDER BY a.created_at DESC LIMIT 10;" < /dev/null || true
            echo "::endgroup::"

            echo "::group::task executions"
            docker compose exec -T pgvector psql -U postgres -d notebookllm-minus -c \
              "SELECT task_name, status, stage, done, total, error_type,
                      left(coalesce(error,''),70) AS error, created_at
                 FROM task_executions ORDER BY created_at DESC LIMIT 12;" < /dev/null || true
            echo "::endgroup::"

            echo "::group::recent worker log"
            docker compose logs --no-color --tail=60 celery-process < /dev/null || true
            echo "::endgroup::"
          REMOTE

      - name: scrub the key
        if: always()
        run: shred -u ~/.ssh/deploy_key 2>/dev/null || rm -f ~/.ssh/deploy_key
