# Realign the Postgres role password with the configuration, over SSH.
#
# POSTGRES_PASSWORD is read by the postgres image exactly once, at initdb,
# against an empty volume. Change it in the environment afterwards and nothing
# happens: the role keeps whatever it was created with, the application starts
# sending the new value, and every connection is refused with
# InvalidPasswordError. The container is otherwise healthy, so the failure
# surfaces as "fastapi-app is unhealthy" several layers away from its cause.
#
# Recreating the volume would fix it and destroy the data with it. ALTER USER
# fixes it and touches nothing else, which is why this exists.
#
# Manual only. This changes a database credential; it is not something a push
# should ever do on its own.
name: Repair database password

on:
  workflow_dispatch:

concurrency:
  group: deploy-main        # never runs while a deploy is mid-flight
  cancel-in-progress: false

env:
  REMOTE_USER: omar
  REMOTE_DIR: /home/omar/notebookllm-minus
  SERVICE: notebookllm-minus

jobs:
  repair:
    name: alter the role, then restart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only the private repo holds the SSH secrets; on a mirror this would run
    # with empty strings and fail for a reason unrelated to the database.
    if: github.repository == 'NotebookLLM-minus/notebookllm-minus'

    steps:
      - name: alter the role over ssh
        env:
          HOST: ${{ secrets.SSH_MAIN_HOST_IP }}
          SSH_KEY: ${{ secrets.SSH_MAIN_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          KEY_DIR="$HOME/.ssh"
          KEY_FILE="$KEY_DIR/deploy_key"
          install -m 700 -d "$KEY_DIR"
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          if ! ssh-keyscan -T 10 "$HOST" >> "$KEY_DIR/known_hosts" 2>/dev/null \
             || ! [ -s "$KEY_DIR/known_hosts" ]; then
            echo "::error::no host key from $HOST — is the box up and port 22 open?"
            exit 1
          fi

          ssh -i "$KEY_FILE" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              "$REMOTE_USER@$HOST" \
              "REMOTE_DIR='$REMOTE_DIR' SERVICE='$SERVICE' bash -euo pipefail -s" <<'REMOTE'
            cd "$REMOTE_DIR"

            # Taken from the file already on the box rather than passed in as a
            # workflow input: the value is whatever the application is
            # configured to send, so reading it here is what makes the two
            # agree by construction. It also keeps the password out of the
            # workflow, the run log and GitHub's API.
            PW=$(sed -nE 's/^[[:space:]]*POSTGRES_PASSWORD[[:space:]]*=[[:space:]]*//p' \
                 Docker/env/.env.app | head -1 | tr -d '"'"'" | tr -d "[:space:]")

            if [ -z "$PW" ]; then
              echo "::error::no POSTGRES_PASSWORD in Docker/env/.env.app"
              exit 1
            fi
            echo "read a password of ${#PW} characters from .env.app"

            # -v plus :'pw' so the value is passed as a parameter and quoted by
            # psql, not interpolated into SQL by the shell. Nothing echoes it.
            # This connects over the container's local socket, which trusts
            # without a password — the only reason this is possible at all.
            docker exec -i pgvector-db \
              psql -U postgres -v pw="$PW" -c "ALTER USER postgres PASSWORD :'pw';"

            sudo -n /usr/bin/systemctl restart "$SERVICE"

            systemctl is-active --quiet "$SERVICE"
            (cd Docker && docker compose ps)
          REMOTE

      - name: scrub the key
        if: always()
        run: shred -u ~/.ssh/deploy_key 2>/dev/null || rm -f ~/.ssh/deploy_key
