## =============================================================================
## RabbitMQ Server Configuration
## =============================================================================
## This file is read at startup. Restart the container after any change.
## Keys use the "new-style" flat format (KEY = VALUE); the old erlang-term
## format (advanced.config) is only needed for exotic settings.
##
## Official reference:
##   https://www.rabbitmq.com/configure.html#config-file

## ---------------------------------------------------------------------------
## Networking
## ---------------------------------------------------------------------------

## TCP port AMQP clients connect on. The default is 5672.
## ⚠️  ACTION: change only if 5672 is already occupied on the host.
listeners.tcp.default = 5672

## The management HTTP API and UI port. Default is 15672.
## ⚠️  ACTION: change only if 15672 is already occupied.
management.tcp.port = 15672

## ---------------------------------------------------------------------------
## Authentication & Access
## ---------------------------------------------------------------------------

## Default virtual-host automatically created at first boot. "/" is the
## RabbitMQ convention; change only if your app targets a different vhost.
## ⚠️  ACTION: must match RABBITMQ_DEFAULT_VHOST in .env.rabbitmq.
default_vhost = /

## Loopback-only restriction: by default only 'guest' can connect from 127.0.0.1.
## The application runs in a separate container so we must lift this restriction.
## Do NOT set this back to 127.0.0.1 in production without adding a real user.
loopback_users = none

## ---------------------------------------------------------------------------
## Resource limits
## ---------------------------------------------------------------------------

## Memory high-watermark: RabbitMQ blocks publishers when memory use exceeds
## this fraction of total RAM. 0.4 (40 %) is the default.
## ⚠️  ACTION: lower on a shared host (e.g. 0.3 on a 4 GB box); raise on a
##             dedicated broker.
vm_memory_high_watermark.relative = 0.4

## Disk free-space alarm. Publishing stops when free space falls below this.
## ⚠️  ACTION: set to at least 10 % of the expected queue data volume.
##             "50MB" is the absolute minimum; "1GB" is safer for production.
disk_free_limit.absolute = 50MB

## ---------------------------------------------------------------------------
## Logging
## ---------------------------------------------------------------------------

## Severity filter for the main log.
## Valid values (ascending): debug | info | warning | error | critical | none
## "info" is production-safe; use "debug" only while troubleshooting.
log.console.level = info

## ---------------------------------------------------------------------------
## Metrics
## ---------------------------------------------------------------------------

## `management_metrics_collection` is a deprecated feature: RabbitMQ is moving
## metrics delivery off the management API/UI and onto the Prometheus plugin,
## which this image already has enabled (rabbitmq_prometheus, port 15692).
## Turning the collector off is what stops the broker using the deprecated
## feature — the boot log names it explicitly otherwise.
##
## TRADE-OFF: the management UI keeps working (queues, connections, users,
## publishing a test message) but loses its built-in charts. Those numbers are
## in Grafana instead, via the prometheus scrape added in prometheus.yml.
## Set this back to false if you would rather keep the UI graphs.
management_agent.disable_metrics_collector = true

## Emit structured JSON lines to stdout so Docker's log driver ingests them.
## ⚠️  ACTION: keep this on; comment it out only if your log aggregator cannot
##             parse JSON (very rare).
log.console.formatter = json

## ---------------------------------------------------------------------------
## Heartbeat & timeouts
## ---------------------------------------------------------------------------

## Heartbeat interval in seconds negotiated with the AMQP client.
## 0 disables heartbeats (not recommended). 60 is the AMQP 0-9-1 default.
heartbeat = 60

## ---------------------------------------------------------------------------
## Clustering (single-node mode — left as reference)
## ---------------------------------------------------------------------------

## A single node is started here. To add nodes, uncomment the lines below.
## See: https://www.rabbitmq.com/cluster-formation.html
# cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
# cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq1
# cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq2
