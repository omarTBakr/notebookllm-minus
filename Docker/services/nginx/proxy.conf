# Reverse proxy in front of the app.
#
# Two jobs: terminate client connections on :80 so the app is not published
# directly, and keep /metrics off the public side. Prometheus still scrapes it
# over the compose network at fastapi:8000, which never passes through here.

events {}

http {
    # The app streams answers over SSE. Buffering would hold the whole reply
    # until it finished, which turns a token-by-token stream into a long pause
    # followed by a wall of text.
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # Docker's embedded DNS. Without a resolver, nginx resolves fastapi:8000
    # once at startup and caches that IP for the life of the process — so every
    # `docker compose up --build` gives the app a new address and nginx keeps
    # proxying to the old one, serving 502 until nginx itself is restarted.
    # `valid=10s` re-resolves instead.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # "upgrade" when the client asks for a WebSocket, "close" otherwise.
    # Used by the /grafana/ location below.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        # Metrics are unauthenticated and describe the route inventory, model
        # ids and traffic shape. Prometheus reaches them on the internal
        # network; nothing outside needs them.
        location /metrics {
            deny all;
            return 404;
        }

        # Uploads are capped at MAX_FILE_SIZE (50 MB) in the app. nginx
        # defaults to 1 MB and would reject a large PDF with a 413 before the
        # app ever saw it.
        client_max_body_size 64M;

        # --- Visualization: the operations tools, inside the app -------------
        #
        # Grafana, Flower and RabbitMQ's management UI are framed by the app
        # (the Visualization button). They are served from this origin so the
        # browser needs one address, and only to a signed-in user: Grafana and
        # Flower have no sign-in of their own here, so the app's session is
        # the gate. Langfuse is not here: its image cannot be served under a
        # sub-path, so it stays on its own port with its own sign-in.

        # The gate. A sub-request to the app's own /auth/me: 200 with a valid
        # session cookie, 401 without. `internal` keeps it unreachable from
        # outside.
        location = /_auth {
            internal;
            set $upstream_app "fastapi:8000";
            proxy_pass http://$upstream_app/auth/me;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Original-URI $request_uri;
        }

        # Each tool is configured to live under its prefix (Grafana:
        # GF_SERVER_SERVE_FROM_SUB_PATH; Flower: --url_prefix; RabbitMQ:
        # management.path_prefix), so the URI is passed through untouched.
        location /grafana/ {
            auth_request /_auth;
            set $upstream_grafana "grafana:3000";
            proxy_pass http://$upstream_grafana$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # Grafana Live (dashboard refresh) is a WebSocket.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /flower/ {
            auth_request /_auth;
            set $upstream_flower "flower:5555";
            proxy_pass http://$upstream_flower$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /rabbitmq/ {
            auth_request /_auth;
            set $upstream_rabbitmq "rabbitmq:15672";
            proxy_pass http://$upstream_rabbitmq$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location / {
            # Through a variable on purpose: a literal upstream name is
            # resolved at startup and cached, while a variable makes nginx
            # honour the resolver above. $request_uri is required because
            # proxy_pass with a variable does not forward the original URI.
            set $upstream_app "fastapi:8000";
            proxy_pass http://$upstream_app$request_uri;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Passed through rather than generated here, so one id follows a
            # request across nginx, the app's logs and its metrics. The app
            # mints one when this is absent.
            proxy_set_header X-Request-ID $http_x_request_id;
        }
    }
}
