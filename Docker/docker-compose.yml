# The full stack: the app, its stores, and the observability side.
#
# Run from this directory (`cd Docker && docker compose up -d`). The build
# context is the repository root because the application lives in src/ and the
# lockfile with it — hence `context: ..` and a dockerfile path that starts with
# Docker/.
#
# Layout: services/<name>/ holds each service's checked-in config (nginx,
# prometheus, grafana, rabbitmq, redis, the app Dockerfile); env/ holds the
# per-service environment files.
#
# Every service gets its settings the same way: an `env_file:` entry pointing
# into env/, read by compose on its own. Nothing has to be passed on the
# command line -- `docker compose up -d --build` is the whole command, from any
# shell, a systemd unit or a CI job alike.
#
# That rules out ${...} substitution for anything that must be set, because
# compose only substitutes from the shell, --env-file, or Docker/.env. It used
# to take the database credentials that way, which meant every command needed
# three --env-file flags, and one run without them failed on a required
# variable (or, before the guard, started Postgres with a blank password).
# The one substitution left is the nginx host port: a port mapping cannot come
# from env_file, it is not a secret, and it has a default. It lives in
# Docker/.env, which compose reads automatically.
#
# Nothing else is hardcoded here.
#
# Two databases are declared but only one is used at a time: DOCUMENT_DB_BACKEND
# in src/.env picks between them. pgvector holds documents *and* vectors; mongo
# pairs with qdrant. Start only the profile you need — see `profiles:` below.

# Shared definition for the Celery workers. An extension field at the top
# level of the document — inside `services:` Compose reads `x-celery-worker`
# as an actual service name and starts a container from it (with no command,
# so it runs the image's uvicorn CMD: a stray, unwanted API server).
x-celery-worker: &celery-worker
  build:
    context: ..
    dockerfile: Docker/services/notebookllm-minus/Dockerfile
  image: notebookllm-minus
  restart: unless-stopped
  env_file:
    - ./env/.env.app
  environment:
    # prometheus_client's multiprocess mode: each prefork child writes its
    # samples here and the worker's parent serves them on WORKER_METRICS_PORT
    # (see celery_app.py). Set in compose, not .env.app, because the API must
    # NOT have it -- it would switch the API to file-backed metrics too.
    PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus-multiproc
  # In memory and empty on every start, so no samples from a previous run are
  # merged in as current.
  tmpfs:
    - /tmp/prometheus-multiproc:mode=1777
  networks:
    - backend
  depends_on:
    rabbitmq:
      condition: service_healthy
    redis:
      condition: service_healthy
    pgvector:
      condition: service_healthy
  # The image's own HEALTHCHECK probes http://127.0.0.1:8000/base/health, which
  # is the API. A worker serves no HTTP, so every worker inherited a probe that
  # can only fail and sat "unhealthy" forever while processing jobs perfectly
  # well. Ask Celery instead: `inspect ping` round-trips through the broker to
  # this worker, so a pong means the thing that actually matters — it is
  # connected and consuming.
  healthcheck:
    test: ["CMD-SHELL", "celery -A celery_app:celery_app inspect ping -d celery@$$HOSTNAME | grep -q pong"]
    interval: 30s
    timeout: 15s
    retries: 3
    start_period: 40s

services:

  # --- the application --------------------------------------------------------

  fastapi:
    build:
      context: ..
      # Relative to the context (the repo root), so it must include Docker/.
      # The previous value resolved to <root>/notebookllm-minus/Dockerfile,
      # which does not exist.
      dockerfile: Docker/services/notebookllm-minus/Dockerfile
    image: notebookllm-minus
    container_name: fastapi-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      # Singular. `env_files:` is not a compose key and was silently ignored.
      - ./env/.env.app
    networks:
      - backend
    extra_hosts:
      # Ollama runs on the host, not in this stack. On Linux `host.docker.internal`
      # is not automatic — this maps it to the docker bridge gateway so
      # OLLAMA_HOST=host.docker.internal can reach out of the container.
      - "host.docker.internal:host-gateway"
    depends_on:
      pgvector:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No healthcheck block: the image defines its own, and depends_on's
    # service_healthy honours it. Repeating it here was the same probe twice,
    # in two files that could drift.

  # Three tasks on this one queue: `process_data_task` plans the ingestion,
  # `parse_batch_task` extracts one page batch, and `assemble_chunks_task`
  # puts the corrected batches back together and stores the chunks. They share
  # a queue for the same reason the index build shares the index queue -- a
  # queue absent from a -Q list has no consumer, and a task published to it
  # sits QUEUED forever with no error to say so.
  #
  # Concurrency is what makes the batching worth anything. Extraction used to
  # run a process pool inside one task, which a daemonic prefork worker is not
  # allowed to start, so in practice a 274-page document was extracted serially
  # -- ~520s of a 1800s budget. Now that the document arrives as ~28
  # independent batch messages, this is what actually parallelises it.
  #
  # No --concurrency flag here, deliberately, and it is the only worker without
  # one. CELERY_WORKER_CONCURRENCY defaults to 0 meaning "every CPU this
  # container may use", and working that out needs the cgroup quota and the
  # affinity mask -- which a compose shell cannot read and Python can. So
  # celery_app sets `worker_concurrency` from the resolved setting, and a CLI
  # flag would silently override it: the flag beats conf in Celery, so adding
  # one back here would quietly pin this worker to whatever number it names.
  celery-process:
    <<: *celery-worker
    container_name: celery-process
    command: ["sh", "-c", "celery -A celery_app:celery_app worker -Q \"$${CELERY_PROJECT_NAME}.process_data_task\" --loglevel=INFO"]

  # The correction pass, and the one new queue in this pipeline.
  #
  # Separate because it is the only stage that waits on a *model* rather than a
  # CPU: tens of seconds a page against milliseconds to parse one. Behind an
  # extraction on the process queue, one large document's corrections would
  # stall every other document's parsing for minutes.
  #
  # Concurrency 8. Was 2, on the reasoning that Ollama serialises requests
  # per model so extra workers just queue inside it -- stopped being true
  # the day POSTPROCESS_MODEL_ID moved to a hosted NVIDIA NIM endpoint
  # (env/.env.app): a hosted API serves concurrent requests, this stage
  # spends nearly all its time waiting on one, and CPU is not the
  # constraint here the way it is for celery-process's genuinely CPU-bound
  # parsing (which is why that one, not this one, is sized from
  # CELERY_WORKER_CONCURRENCY).
  #
  # 8 rather than higher: this box has 24 cores but env/.env.app pins
  # celery-process's CPU-bound work to just 2 of them, deliberately, to
  # leave room for other projects sharing the machine (see NGINX_PORT's own
  # comment above) -- and nothing here documents how many concurrent
  # requests the NVIDIA key backing POSTPROCESS_MODEL_ID actually tolerates.
  # 8 is a real, testable step up from 4 without either assumption. Each
  # concurrent task holds one batch's pages (with word boxes) in memory for
  # the length of the model call, so this trades roughly 2x the peak memory
  # this worker used at 4 for roughly 2x the correction throughput -- watch
  # both before raising it again.
  celery-postprocess:
    <<: *celery-worker
    container_name: celery-postprocess
    command: ["sh", "-c", "celery -A celery_app:celery_app worker -Q \"$${CELERY_PROJECT_NAME}.postprocess_batch_task\" --loglevel=INFO --concurrency=8"]

  # Two tasks on this one queue, not one: `index_project_task` embeds the
  # chunks and `build_vector_index_task` builds the ANN index over them. The
  # build is a separate link of the chain so it is visible in Flower and gets
  # its own task_executions row, but it is routed here rather than to a queue
  # of its own — a queue absent from a -Q list has no consumer, and a task
  # published to it sits QUEUED forever with no error to say so. Sharing this
  # queue also puts the build on the worker that just wrote the vectors, and
  # concurrency 1 keeps it strictly after them.
  celery-index:
    <<: *celery-worker
    container_name: celery-index
    command: ["sh", "-c", "celery -A celery_app:celery_app worker -Q \"$${CELERY_PROJECT_NAME}.index_project_task\" --loglevel=INFO --concurrency=1"]

  # Studio generation: flashcard decks and quizzes. Its own queue and its own
  # worker so a deck never sits behind an ingest -- the two have nothing in
  # common but the broker, and a book takes minutes either way.
  #
  # Concurrency 4, unlike the ingest worker's 1. That worker is 1 because OCR
  # burns cores and two documents at once each got half the machine; this one
  # spends nearly all its time waiting on a model API, so four concurrent runs
  # cost almost no CPU and four users get their decks at once instead of in
  # series. The reasoning behind ingest's concurrency does not transfer.
  celery-studio:
    <<: *celery-worker
    container_name: celery-studio
    command: ["sh", "-c", "celery -A celery_app:celery_app worker -Q \"$${CELERY_PROJECT_NAME}.generate_artifact_task\" --loglevel=INFO --concurrency=4"]

  # `/memory` extraction: pull facts out of one chat message, upsert them,
  # embed each one. Its own queue and worker for the same reason celery-studio
  # has one -- it spends its time waiting on a model API, not on CPU, so
  # several can run at once cheaply, and it must not sit behind an ingest.
  celery-memory:
    <<: *celery-worker
    container_name: celery-memory
    command: ["sh", "-c", "celery -A celery_app:celery_app worker -Q \"$${CELERY_PROJECT_NAME}.extract_memory_task\" --loglevel=INFO --concurrency=4"]

  # Consumes the periodic sweep of task_executions. Concurrency 1: there is
  # one scheduled job and running two copies of a sweep concurrently would
  # have them contend over the same rows for no gain.
  celery-maintenance:
    <<: *celery-worker
    container_name: celery-maintenance
    command: ["sh", "-c", "celery -A celery_app:celery_app worker -Q \"$${CELERY_PROJECT_NAME}.maintenance_task\" --loglevel=INFO --concurrency=1"]

  # The scheduler. Publishes the sweep on CELERY_MAINTENANCE_INTERVAL_HOURS and
  # runs no tasks itself, which is why it gets no queue and no concurrency.
  #
  # Exactly one replica, always: beat is a publisher, and a second one would
  # publish the same scheduled job again. Its schedule file goes in a volume so
  # a restart does not re-fire a job it had already sent — beat records the
  # last run time there, and without it every deploy would trigger a sweep.
  celery-beat:
    <<: *celery-worker
    container_name: celery-beat
    command: ["sh", "-c", "celery -A celery_app:celery_app beat --loglevel=INFO --schedule=/app/celerybeat/schedule"]
    volumes:
      - celerybeat:/app/celerybeat
    # The worker healthcheck inherited from the anchor pings a *worker*, and
    # beat is not one — it would fail forever. Checking that the scheduler
    # process is alive is the honest check.
    #
    # Reading /proc rather than pgrep, which python:3.12-slim does not ship
    # (procps is not installed) — the same trap the Flower probe fell into.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys; sys.exit(0 if any('beat' in open('/proc/%s/cmdline' % p, 'rb').read().decode('utf-8','ignore') for p in os.listdir('/proc') if p.isdigit()) else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # --- Celery dashboard -------------------------------------------------------

  # Reads the broker and the result backend directly; it is not a worker and
  # runs no tasks. Task history depends on events, which are enabled once in
  # celery_app.py (worker_send_task_events / task_send_sent_event) rather than
  # as -E on each worker command, so the four worker commands cannot drift out
  # of sync with it. task_send_sent_event is the one that matters most here:
  # it is what makes a task that *no worker ever picked up* visible, which is
  # the failure this dashboard is being added to catch.
  flower:
    # The application image, not mher/flower: Flower is started with
    # `--app celery_app:celery_app`, which needs this project's code on the
    # path so it reads the same broker and backend URLs config.py builds from
    # CELERY_*. The stock image carries neither, and would need the DSN
    # duplicated here as a literal.
    build:
      context: ..
      dockerfile: Docker/services/notebookllm-minus/Dockerfile
    image: notebookllm-minus
    container_name: flower
    restart: unless-stopped
    env_file:
      - ./env/.env.app
    # No --port here: FLOWER_PORT in env/.env.app is the single source, and a
    # flag would silently outrank it. Every other Flower option is configured
    # the same way (FLOWER_BASIC_AUTH, FLOWER_PERSISTENT, FLOWER_MAX_TASKS...).
    command: ["celery", "--app", "celery_app:celery_app", "flower"]
    working_dir: /app
    ports:
      # Literal, and must match FLOWER_PORT: a ports: mapping cannot read a
      # value out of env_file.
      - "5555:5555"
    volumes:
      # FLOWER_PERSISTENT writes its task history here. Without the volume the
      # dashboard forgets every task on restart, which is precisely when the
      # failures it exists to show are worth looking at.
      - flower:/app/flower
    networks:
      - backend
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # python, not wget or curl: python:3.12-slim ships neither, so a probe
      # using them fails forever while the service itself is fine. Same
      # reasoning as the app's own HEALTHCHECK in the Dockerfile.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5555/healthcheck', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # --- reverse proxy ----------------------------------------------------------

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      # Not 80: this machine already runs Apache (httpd) there. Inside the
      # container nginx still listens on 80, which is what nginx.conf and the
      # other services expect.
      #
      # Not 8080 either, any more: this developer machine runs a Temporal UI on
      # it for an unrelated project, and the collision failed the whole
      # `compose up` at the last service with "Bind for 0.0.0.0:8080 failed:
      # port is already allocated" -- after every other container had started.
      # Overridable so a host with a different set of neighbours can say so
      # without editing this file.
      - "${NGINX_PORT:-8081}:80"
    volumes:
      # proxy.conf, not nginx.conf: Docker Desktop's file sharing cached the
      # old path as missing after an in-place replace on this external drive,
      # and every container mounting it saw an empty file. A fresh path is the
      # reliable way out; the contents are unchanged.
      - ./services/nginx/proxy.conf:/etc/nginx/nginx.conf:ro
    networks:
      - backend
    depends_on:
      fastapi:
        condition: service_healthy

  # --- document + vector store (postgres backend) -----------------------------

  pgvector:
    # Pinned to the version actually in use. `latest` on a database is a way to
    # discover a breaking change during an outage.
    image: pgvector/pgvector:0.8.6-pg18-trixie
    container_name: pgvector-db
    restart: unless-stopped
    # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB, under the image's own
    # names. A missing file stops compose outright; a missing password stops
    # the image, which refuses to initialise a database without one.
    env_file:
      - ./env/.env.postgres
    ports:
      - "5400:5432"
    volumes:
      - pgvector:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      # $$: the container's own variables, from env_file, expanded by its shell.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --- document + vector store (mongo backend) --------------------------------
  # Both under a profile, so `docker compose up` does not start a database the
  # app is not configured to use. Bring them up with `--profile mongo`.

  mongo:
    image: mongo:8.2
    container_name: mongo-db
    profiles: ["mongo"]
    restart: unless-stopped
    env_file:
      - ./env/.env.mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb:/data/db
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: qdrant-db
    profiles: ["mongo"]
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant:/qdrant/storage
    networks:
      - backend

  # --- message broker ---------------------------------------------------------

  rabbitmq:
    # Pinned to the management-enabled variant so the HTTP API / web UI
    # (port 15672) are available without a separate plugin install step.
    image: rabbitmq:4.1-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    env_file:
      - ./env/.env.rabbitmq
    ports:
      # AMQP clients (app, workers, publishers)
      - "5672:5672"
      # Management web UI — browse to http://localhost:15672
      - "15672:15672"
      # Prometheus exporter endpoint used by the Grafana RabbitMQ dashboard.
      - "15692:15692"
    volumes:
      # Durable queue/exchange definitions and messages survive restarts.
      - rabbitmq:/var/lib/rabbitmq
      # Custom broker config: listener ports, memory watermarks, log format.
      - ./services/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s
    command: ["sh", "-c", "rabbitmq-plugins enable --offline rabbitmq_prometheus && exec rabbitmq-server"]

  # --- cache / session store ---------------------------------------------------

  redis:
    # Pinned minor version; alpine keeps the image small.
    image: redis:7.4-alpine
    container_name: redis
    restart: unless-stopped
    env_file:
      - ./env/.env.redis
    ports:
      # Exposed on the host for local tooling (redis-cli, RedisInsight).
      - "6379:6379"
    volumes:
      # Named volume so RDB snapshots / AOF survive container recreation.
      - redis:/data
      # Our redis.conf overrides the image defaults (password, maxmemory…).
      - ./services/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    # Pass the config file explicitly; the image default CMD ignores custom
    # conf files without this override.
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - backend
    healthcheck:
      # redis-cli PING returns PONG when the server is up and authenticated.
      # $$REDIS_PASSWORD (double $): compose passes this to the container shell
      # as $REDIS_PASSWORD, which is set via env_file: ./env/.env.redis.
      # Single ${REDIS_PASSWORD} would be substituted by compose from its own
      # --env-file set (which does not include env/.env.redis) → empty string →
      # WRONGPASS → healthcheck fails.
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- observability ----------------------------------------------------------

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      # Without this mount Prometheus starts with its built-in defaults and
      # scrapes nothing — which is what the previous file did.
      - ./services/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    networks:
      - backend
    extra_hosts:
      # The `node` job scrapes host.docker.internal:9100, where node_exporter
      # runs on the host rather than in this stack. Docker Desktop provides
      # that name for free, so this was only ever needed on Linux — where the
      # name does not resolve at all, and the job sat permanently DOWN with a
      # DNS error while every other target was green. Same mapping the fastapi
      # service already uses to reach the host's Ollama.
      - "host.docker.internal:host-gateway"
    depends_on:
      - fastapi

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./env/.env.grafana
    volumes:
      - grafana:/var/lib/grafana
      # Provisioned at startup: the Prometheus data source and the dashboard,
      # so neither has to be added by hand. The dashboards directory is watched,
      # so editing the JSON on disk updates Grafana without a restart.
      - ./services/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./services/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - backend
    depends_on:
      - prometheus

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: postgres-exporter
    restart: unless-stopped
    # The same file pgvector reads, so the credentials live in one place.
    # .env.postgres-exporter is optional and loaded second: a DATA_SOURCE_NAME
    # there overrides the connection built below.
    env_file:
      - ./env/.env.postgres
      - path: ./env/.env.postgres-exporter
        required: false
    # The exporter wants DATA_SOURCE_* rather than POSTGRES_*, so a shell maps
    # one onto the other before starting it. User and password go in as
    # separate variables, not spliced into a URL, so a password with an @ or a
    # : in it still works. $$: expanded by this shell, not by compose.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        export DATA_SOURCE_URI="pgvector:5432/$${POSTGRES_DB}?sslmode=disable"
        DATA_SOURCE_USER="$${POSTGRES_USER}" DATA_SOURCE_PASS="$${POSTGRES_PASSWORD}";
        exec /bin/postgres_exporter "$$@"
      - postgres_exporter
    # postmaster is off by default and the dashboard's "Start Time" panel needs
    # it. Not enabling --collector.stat_bgwriter: it queries the pre-PG17
    # pg_stat_bgwriter columns, and this is PostgreSQL 18, where the checkpoint
    # counters moved to pg_stat_checkpointer. The flag would emit nothing, so
    # the dashboard's bgwriter and checkpoint panels stay empty either way.
    command:
      - "--collector.postmaster"
    ports:
      # 9187, its actual default. The previous file put this on 9100 and
      # collided with node-exporter, so neither could start.
      - "9187:9187"
    networks:
      - backend
    depends_on:
      pgvector:
        condition: service_healthy

  # --- host-level exporters: deliberately absent -------------------------------
  #
  # node-exporter, cAdvisor and an NVIDIA exporter were here. They are removed
  # because this stack runs on Docker Desktop, whose daemon lives inside a VM:
  #
  #   * node-exporter bind-mounts / with slave propagation to read host state.
  #     Desktop's VM root is neither shared nor slave, so the daemon refuses it
  #     outright — "path / is mounted on / but it is not a shared or slave
  #     mount". That error is what led here.
  #   * cAdvisor starts, but reports the VM's cgroups, not the machine's.
  #   * an NVIDIA exporter cannot see the GPU at all: Desktop's VM has no
  #     passthrough, so the scrape target would sit DOWN forever.
  #
  # A host monitor reporting a VM's numbers is worse than no host monitor: the
  # panels look populated and are quietly wrong. Application metrics,
  # postgres-exporter, Prometheus and Grafana all work here unaffected.
  #
  # To get them back, move this stack to the system daemon
  # (`docker context use default`) and restore these services — the mount flags
  # they used were correct, only the daemon was wrong.

volumes:
  # Flower's persistent task history (FLOWER_PERSISTENT / FLOWER_DB).
  flower:
  # celery beat's last-run record, so a restart does not re-fire the sweep.
  celerybeat:
  pgvector:
  mongodb:
  qdrant:
  rabbitmq:
  redis:
  prometheus:
  grafana:

networks:
  backend:
