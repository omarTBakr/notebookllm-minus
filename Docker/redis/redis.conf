## =============================================================================
## Redis Server Configuration
## =============================================================================
## Drop-in replacement for /etc/redis/redis.conf inside the container.
## Lines starting with '#' are comments. Restart the container to apply.
##
## Official reference:
##   https://redis.io/docs/latest/operate/oss_and_stack/management/config/

## ---------------------------------------------------------------------------
## Network
## ---------------------------------------------------------------------------

## Listen on all interfaces so the app container can reach Redis over the
## Docker bridge. "127.0.0.1" would block inter-container traffic.
## ⚠️  ACTION: never expose 0.0.0.0 on a public IP without requirepass set.
bind 0.0.0.0

## Client-facing port. Default is 6379.
## ⚠️  ACTION: change only if 6379 is already occupied on the host.
port 6379

## TCP listen backlog — number of unaccepted connections to queue.
## 511 is the default; raise to 1024+ on very high-traffic deployments.
tcp-backlog 511

## Close idle client connections after this many seconds. 0 = never.
timeout 0

## ---------------------------------------------------------------------------
## Authentication
## ---------------------------------------------------------------------------

## Require a password before any command is accepted. Leave commented to
## disable auth (fine for local dev; mandatory in any shared environment).
## ⚠️  ACTION REQUIRED: set this to match REDIS_PASSWORD in .env.redis.
##             The value MUST NOT contain spaces.
requirepass admin

## ---------------------------------------------------------------------------
## Persistence
## ---------------------------------------------------------------------------

## RDB snapshot: save a .rdb file when at least N writes happened in M seconds.
## Format: save <seconds> <changes>
## Comment ALL save lines to disable persistence (pure cache mode).
## ⚠️  ACTION: comment out the lines below if Redis is used only as a cache
##             (e.g. FastAPI-Cache) and you do not need durability.
save 3600 1
save 300  100
save 60   10000

## Path for the .rdb dump. Relative to the container working dir; the named
## volume makes it durable across container recreation.
dir /data

## RDB filename. Keep the default unless two Redis instances share /data.
dbfilename dump.rdb

## ---------------------------------------------------------------------------
## Append-Only File (AOF) — optional but recommended for durability
## ---------------------------------------------------------------------------

## Enable to record every write operation.
## ⚠️  ACTION: set to 'yes' if Redis holds data that cannot be rebuilt
##             from the application database on a crash.
appendonly no

## Sync strategy:
##   always   — safest, but slow (one fsync per write)
##   everysec — a good balance (default); at most 1 second of data loss
##   no       — fastest; OS decides when to flush (not recommended)
appendfsync everysec

## AOF filename.
appendfilename "appendonly.aof"

## ---------------------------------------------------------------------------
## Memory management
## ---------------------------------------------------------------------------

## Maximum memory Redis may use. Redis will start evicting when reached.
## 0 = no limit (not recommended in a container).
## ⚠️  ACTION: set to ≤ 80 % of the memory you allocate to the container.
maxmemory 256mb

## Eviction policy when maxmemory is reached.
##   noeviction   — commands fail on new writes (safest for a message store)
##   allkeys-lru  — remove least-recently-used keys (good for a pure cache)
##   volatile-lru — LRU only among keys with a TTL set
## ⚠️  ACTION: choose based on your use case:
##             - pure cache          → allkeys-lru
##             - session / Celery    → volatile-lru or noeviction
maxmemory-policy allkeys-lru

## ---------------------------------------------------------------------------
## Slow log
## ---------------------------------------------------------------------------

## Log commands slower than this many microseconds. 10000 µs = 10 ms.
## 0 logs every command (profiling); -1 disables the slow log.
slowlog-log-slower-than 10000

## Max entries to keep in the slow log ring buffer.
slowlog-max-len 128

## ---------------------------------------------------------------------------
## Databases
## ---------------------------------------------------------------------------

## Number of logical databases (0 through N-1). Default is 16.
## ⚠️  ACTION: reduce to 1 if you only use database 0 (saves a tiny bit of RAM).
databases 16

## ---------------------------------------------------------------------------
## Logging
## ---------------------------------------------------------------------------

## Log level: debug | verbose | notice | warning
## "notice" is appropriate for production.
loglevel notice

## Log to stdout so Docker captures it through the json-file log driver.
logfile ""
