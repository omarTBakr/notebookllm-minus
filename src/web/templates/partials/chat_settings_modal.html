{# Everything that is a property of one notebook: models, generation knobs,
   the splitter, and now how a cited passage is highlighted. Opened from the
   tune icon in the chat panel's own header, not the topbar — that one is
   Appearance only (settings_modal.html). #}
<div class="modal" id="chat-settings-modal" hidden>
  <div class="modal__backdrop" data-close-modal></div>

  <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="chat-settings-heading">
    <header class="modal__head">
      <h2 id="chat-settings-heading" data-i18n="chatSettings"></h2>
      <button class="icon-btn" data-close-modal aria-label="close"><svg class="ico" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-close"/></svg></button>
    </header>

    <div class="modal__body">
      {# Not a <select>: an <option> is plain text and cannot hold the
         Local/Web badge. The list expands inline rather than floating,
         because .modal__panel clips an absolutely positioned popup. #}
      <div class="field">
        <span class="field__label" data-i18n="chatModel"></span>
        <div class="picker" id="model-chat" data-kind="chat">
          <button class="picker__button" type="button" aria-haspopup="listbox" aria-expanded="false" disabled>
            <span class="picker__current"></span>
            <svg class="ico ico--sm picker__caret" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-down"/></svg>
          </button>
          <div class="picker__list" role="listbox" hidden></div>
        </div>
      </div>

      <div class="field">
        <span class="field__label" data-i18n="embedModel"></span>
        <div class="picker" id="model-embed" data-kind="embedding">
          <button class="picker__button" type="button" aria-haspopup="listbox" aria-expanded="false" disabled>
            <span class="picker__current"></span>
            <svg class="ico ico--sm picker__caret" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-down"/></svg>
          </button>
          <div class="picker__list" role="listbox" hidden></div>
        </div>
        <span class="field__hint" data-i18n="embedHint"></span>
      </div>

      <label class="field">
        <span class="field__label">
          <span data-i18n="temperature"></span>
          <output class="field__value" id="temp-value">—</output>
        </span>
        <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.1" disabled>
        <span class="field__hint" data-i18n="temperatureHint"></span>
      </label>

      <label class="field">
        <span class="field__label">
          <span data-i18n="outputLength"></span>
          <output class="field__value" id="tokens-value">—</output>
        </span>
        <input type="range" id="max-tokens" min="256" max="8192" step="256" value="4096" disabled>
      </label>

      <label class="field field--row" data-soon="Web grounding">
        <input type="checkbox" id="web-search" disabled>
        <span data-i18n="webSearch"></span>
      </label>

      <div class="field">
        <span class="field__label" data-i18n="highlightColor"></span>
        <input type="color" id="highlight-color" value="#ffff00" disabled>
        <span class="field__hint" data-i18n="highlightColorHint"></span>
      </div>

      <details class="advanced">
        <summary data-i18n="advanced"></summary>

        <label class="field">
          <span class="field__label">
            <span data-i18n="chunkSize"></span>
            <output class="field__value" id="chunk-value">—</output>
          </span>
          <input type="range" id="chunk-size" min="100" max="2000" step="50" value="1000" disabled>
        </label>

        <label class="field">
          <span class="field__label">
            <span data-i18n="overlapSize"></span>
            <output class="field__value" id="overlap-value">—</output>
          </span>
          <input type="range" id="overlap-size" min="0" max="500" step="10" value="50" disabled>
        </label>

        <p class="field__hint" data-i18n="advancedHint"></p>
      </details>

      <p class="field__hint" id="settings-status"></p>
      <p class="field__hint" id="backend-info">—</p>
    </div>
  </div>
</div>
