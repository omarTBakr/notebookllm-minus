<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true"
     fill="none" stroke="currentColor" stroke-width="1.7"
     stroke-linecap="round" stroke-linejoin="round">
<!--
  One sprite, inlined into the page by base.html and referenced as
  a same-document use reference to #i-<name>, which is
  the only form with no cross-browser caveats.

  All drawn on a 24x24 grid, stroke-only, in currentColor — so an icon takes
  the colour of whatever it sits in and needs no dark-mode variant. The size
  and stroke are set as attributes as well as in CSS, so a stylesheet that has
  not arrived yet cannot leave a 300x150 black rectangle in its place.
-->

<!-- project mark, drawn for header size -->
<symbol id="i-logo" viewBox="0 0 32 24" fill="none" stroke="currentColor">
  <!-- open book -->
  <path d="M16 6.2C13 4.6 9.6 4.3 6 4.9v13c3.6-.6 7 -.3 10 1.3z"/>
  <path d="M16 6.2c3-1.6 6.4-1.9 10-1.3v13c-3.6-.6-7-.3-10 1.3z"/>
  <path d="M16 6.2v13"/>
  <!-- left page: lines of text -->
  <path d="M8.6 8.4h4.8M8.6 11h4.8M8.6 13.6h3.2" stroke-width="1.1" opacity=".75"/>
  <!-- right page: the text becomes a network -->
  <circle cx="19.4" cy="9.2" r="1.15"/>
  <circle cx="19.4" cy="14.4" r="1.15"/>
  <circle cx="23.6" cy="11.8" r="1.15"/>
  <path d="M20.5 9.7l2 1.6M20.5 13.9l2-1.6M19.4 10.4v2.9" stroke-width="1.1" opacity=".75"/>
</symbol>

<!-- generic -->
<symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M15 18l-6-6 6-6"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="6"/><path d="M15.5 15.5L20 20"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12h13M12 6l6 6-6 6"/></symbol>
<symbol id="i-more" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="5" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="12" cy="19" r="1.3"/></symbol>
<symbol id="i-tune" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 8h10M18 8h2M4 16h4M12 16h8"/><circle cx="16" cy="8" r="2"/><circle cx="10" cy="16" r="2"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M21 12h-2.5M5.5 12H3M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8M18.4 18.4l-1.8-1.8M7.4 7.4L5.6 5.6"/></symbol>
<symbol id="i-apps" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="6" cy="6" r="1.3"/><circle cx="12" cy="6" r="1.3"/><circle cx="18" cy="6" r="1.3"/><circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/><circle cx="6" cy="18" r="1.3"/><circle cx="12" cy="18" r="1.3"/><circle cx="18" cy="18" r="1.3"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 5.5A1.5 1.5 0 0013.5 4h-8A1.5 1.5 0 004 5.5v8A1.5 1.5 0 005.5 15"/></symbol>
<symbol id="i-share" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="18" cy="5.5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="18.5" r="2.5"/><path d="M8.2 10.8l7.6-4M8.2 13.2l7.6 4"/></symbol>
<symbol id="i-collapse" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M10 4.5v15"/></symbol>
<!-- One family, three positions: which slot of the workspace a toggle governs. -->
<symbol id="i-panel-left" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M9.5 4.5v15"/></symbol>
<symbol id="i-panel-center" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M9 4.5v15M15 4.5v15"/></symbol>
<symbol id="i-panel-right" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M14.5 4.5v15"/></symbol>
<symbol id="i-sort" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 7h16M4 12h10M4 17h6"/></symbol>
<symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c2.2 2.3 3.3 5 3.3 8s-1.1 5.7-3.3 8c-2.2-2.3-3.3-5-3.3-8S9.8 6.3 12 4z"/></symbol>
<symbol id="i-spark" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 4l1.7 4.6L18.5 10l-4.8 1.4L12 16l-1.7-4.6L5.5 10l4.8-1.4z"/><path d="M18 16.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></symbol>
<symbol id="i-note" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 4.5h14v10l-4.5 5H5z"/><path d="M19 14.5h-4.5v5"/><path d="M8.5 9h7M8.5 12.5h4"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 4v8h3l-8 8-8-8h3V4z"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 5.5C6.7 4.3 9.6 4.3 12 5.5v13c-2.4-1.2-5.3-1.2-8-.2z"/><path d="M20 5.5c-2.7-1.2-5.6-1.2-8 0v13c2.4-1.2 5.3-1.2 8-.2z"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 3.5h7l5 5v12H6z"/><path d="M13 3.5v5h5"/><path d="M9 13h6M9 16.5h6"/></symbol>

<!-- studio features -->
<symbol id="i-audio" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 11v2M8 8v8M12 5v14M16 9v6M20 11v2"/></symbol>
<symbol id="i-slides" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M9 21h6M12 17v4"/></symbol>
<symbol id="i-video" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="M15 10.5l6-3.5v10l-6-3.5z"/></symbol>
<symbol id="i-mindmap" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="5" cy="12" r="2.2"/><circle cx="19" cy="6" r="2.2"/><circle cx="19" cy="12" r="2.2"/><circle cx="19" cy="18" r="2.2"/><path d="M7.2 11.3l9.6-4.4M7.2 12h9.6M7.2 12.7l9.6 4.4"/></symbol>
<symbol id="i-report" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 3.5h8l4 4v13H6z"/><path d="M14 3.5v4h4"/><path d="M9 12v4M12 10v6M15 13.5v2.5"/></symbol>
<symbol id="i-cards" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="7" y="7" width="13" height="13" rx="2"/><path d="M17 7V5.5A1.5 1.5 0 0015.5 4h-10A1.5 1.5 0 004 5.5v10A1.5 1.5 0 005.5 17H7"/></symbol>
<symbol id="i-quiz" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.4a2.5 2.5 0 114 2.3c-.9.6-1.6 1.1-1.6 2.1"/><circle cx="12" cy="17" r="1"/></symbol>
<symbol id="i-info" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M7.5 16v-4M12 16V8M16.5 16v-6"/></symbol>
<symbol id="i-table" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M3.5 10h17M3.5 14.5h17M9.5 10v9M15 10v9"/></symbol>
</svg>
