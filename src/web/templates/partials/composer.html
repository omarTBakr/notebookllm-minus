{# Attach + ask. Disabled until a chat is selected. #}
<footer class="composer">
  <div class="composer__files" id="attachments"></div>
  <form class="composer__row" id="composer-form">
    <label class="btn btn--icon" id="attach-label" title="attach">
      📎
      <input type="file" id="file-input" accept=".pdf,.txt,text/plain,application/pdf" hidden>
    </label>
    <textarea id="question" rows="1" data-i18n-placeholder="askPlaceholder" disabled></textarea>
    <button class="btn btn--primary" id="btn-send" type="submit" disabled data-i18n="send"></button>
  </form>
  <p class="composer__hint muted small" data-i18n="hint"></p>
</footer>
