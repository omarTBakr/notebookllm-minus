{# Identity, sessions and chats. Populated by sidebar.js. #}
<aside class="sidebar" id="sidebar">
  <header class="sidebar__head">
    <h1 class="brand">{{ app_name }}</h1>
    <p class="brand__sub" data-i18n="tagline"></p>
  </header>

  <section class="identity" id="identity">
    <p class="identity__who"><span data-i18n="user"></span>
      <code id="user-badge">—</code>
    </p>
    <div class="identity__actions">
      <button class="btn btn--ghost" id="btn-new-user" data-i18n="newUser"></button>
      <button class="btn btn--ghost" id="btn-forget-user" data-i18n="forgetUser"></button>
    </div>
  </section>

  <section class="sessions">
    <div class="sessions__head">
      <h2 data-i18n="sessions"></h2>
      <button class="btn btn--icon" id="btn-new-session" title="+">+</button>
    </div>
    <div id="session-list" class="session-list">
      <p class="muted" data-i18n="noSessions"></p>
    </div>
  </section>

  <footer class="sidebar__foot">
    <div class="langswitch" role="group" aria-label="Language">
      <button class="btn btn--lang" data-lang="en">English</button>
      <button class="btn btn--lang" data-lang="ar">العربية</button>
    </div>
    <p class="muted small" id="backend-info">—</p>
  </footer>
</aside>
