{# Appearance only — theme and language, the two things that belong to the
   interface rather than to one notebook. Everything per-chat lives in
   chat_settings_modal.html now, behind the tune icon in the chat panel. #}
<div class="modal" id="settings-modal" hidden>
  <div class="modal__backdrop" data-close-modal></div>

  <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="settings-heading">
    <header class="modal__head">
      <h2 id="settings-heading" data-i18n="appearance"></h2>
      <button class="icon-btn" data-close-modal aria-label="close"><svg class="ico" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-close"/></svg></button>
    </header>

    <div class="modal__body">
      <div class="field">
        <span class="field__label" data-i18n="theme"></span>
        <div class="segmented" role="group" aria-label="Theme">
          <button class="btn btn--seg" data-theme-choice="light" data-i18n="themeLight"></button>
          <button class="btn btn--seg" data-theme-choice="dark" data-i18n="themeDark"></button>
          <button class="btn btn--seg" data-theme-choice="system" data-i18n="themeSystem"></button>
        </div>
      </div>

      <div class="field">
        <span class="field__label" data-i18n="language"></span>
        <div class="langswitch">
          <button class="btn btn--lang" data-lang="en">English</button>
          <button class="btn btn--lang" data-lang="ar">العربية</button>
        </div>
      </div>
    </div>
  </div>
</div>
