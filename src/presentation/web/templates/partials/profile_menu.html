{# No login — a profile picker, anchored under the avatar. #}
<div class="dropdown" id="profile-menu" hidden>
  <p class="dropdown__title" data-i18n="profiles"></p>
  <div class="dropdown__list" id="profile-list"></div>
  <div class="dropdown__actions">
    <button class="btn btn--ghost" id="btn-new-profile" data-i18n="newProfile"></button>
    <button class="btn btn--ghost" id="btn-rename-profile" data-i18n="rename"></button>
    <button class="btn btn--ghost btn--warn" id="btn-delete-profile" data-i18n="deleteProfile"></button>
  </div>
</div>
