[project]
name = "notebookllm-minus"
version = "2.0.0"
description = "Upload documents, ask questions, get answers grounded in them — a small, readable NotebookLM-style RAG backend."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # --- web ---
    "fastapi[standard]>=0.140.0",
    "starlette>=0.40",          # imported directly by middleware/request_logging.py
    "uvicorn>=0.51.0",
    "python-multipart>=0.0.9",  # FastAPI needs it to parse UploadFile
    "jinja2>=3.1",              # FastAPI's Jinja2Templates, for web/templates/
    "httpx>=0.27",              # direct: ModelController / NLPController probes
    "aiofiles>=25.1.0",
    # --- observability ---
    # Metrics are scraped from /metrics; the instrumentator supplies the HTTP
    # RED signals, prometheus-client the app-specific collectors in
    # utils/metrics.py.
    "prometheus-client>=0.21",
    "prometheus-fastapi-instrumentator>=7.0",
    # --- config and validation ---
    "pydantic>=2.7",            # imported directly by every model and schema
    "pydantic-settings>=2.14.2",
    # --- document store: mongo ---
    "motor>=3.7.1",
    # bson.ObjectId and pymongo are imported directly — and not only by the
    # Mongo backend: the shared schemas type their ids as ObjectId, so the
    # Postgres backend needs this too. Too load-bearing to leave to motor.
    "pymongo>=4.9",
    # --- document store: postgres ---
    # The [asyncio] extra is what pulls greenlet in unconditionally. Plain
    # "sqlalchemy" only requires it on a list of known platform_machines, so a
    # machine outside that list installs fine and then fails on the first
    # await. We always use the async engine, so always take the extra.
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.31.0",
    "alembic>=1.19.1",
    # --- vector store: qdrant (pairs with mongo) ---
    "qdrant-client>=1.12.0",
    # --- ingestion ---
    "langchain-community>=0.4.2",
    "langchain-core>=0.4.0",
    "langchain-text-splitters>=1.1.2",
    "pypdf>=6.14.2",            # PyPDFLoader's parser
    # NLTKTextSplitter's sentence tokenizer. langchain-text-splitters imports
    # it lazily and does not depend on it, so it has to be named here.
    "nltk>=3.9",
    # --- llm providers ---
    "anthropic>=0.40.0",
    "cohere>=5.13.0",
    "google-genai>=1.0.0",
    "ollama>=0.4.0",
    "openai>=1.60.0",
    "pdfplumber>=0.11.10",
    "pymupdf>=1.28.2",
    # celery[redis] rather than bare celery: the result backend is a redis://
    # URL, and without the extra Celery raises ModuleNotFoundError the moment
    # it resolves the backend — so every worker fails on its first result and
    # both task-status endpoints 500. kombu/billiard/vine are celery's own
    # dependencies, pinned here only to keep the lockfile explicit.
    "celery[redis]>=5.5.0",
    # The Celery dashboard. Installed into the application image rather than
    # run from mher/flower so it can be started with `--app celery_app:celery_app`:
    # that reuses the broker/backend DSNs config.py already assembles from the
    # CELERY_* variables, instead of maintaining a second copy of the URL in
    # compose that could drift from the one the workers use.
    "flower>=2.0.1",
    "kombu>=5.6.2",
    "billiard>=4.2.4",
    "vine>=5.1.0",
]

# Removed: "dotenv", which is a stub package whose only content is a dependency
# on python-dotenv. Nothing imports either one — pydantic-settings requires
# python-dotenv itself, and that is what reads env_file.

[dependency-groups]
dev = [
    "black>=25.1.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.11.0",
]

[tool.black]
target-version = ["py312"]
line-length = 120
extend-exclude = '''
/(\.git|\.mypy_cache|\.pytest_cache|\.ruff_cache|\.venv|assets|web/static/js/vendor)/
'''

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "assets",
    "web/static/js/vendor",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
