[project]
name = "notebookllm-minus"
version = "0.1.0"
description = "Upload documents, ask questions, get answers grounded in them — a small, readable NotebookLM-style RAG backend."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "anthropic>=0.40.0",
    "cohere>=5.13.0",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.140.0",
    "google-genai>=1.0.0",
    "langchain-community>=0.4.2",
    "langchain-core>=0.4.0",
    "langchain-text-splitters>=1.1.2",
    "motor>=3.7.1",
    "ollama>=0.4.0",
    "openai>=1.60.0",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.14.2",
    "python-multipart>=0.0.9",
    "qdrant-client>=1.12.0",
    "uvicorn>=0.51.0",
]
