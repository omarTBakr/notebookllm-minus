# Alembic config for the Postgres backend.
#
# It lives next to the repositories it migrates rather than at the repo root,
# so the whole Postgres story is one directory. That means the CLI needs to be
# pointed at it, from src/:
#
#   uv run alembic -c factories/db/postgres/alembic.ini upgrade head
#   uv run alembic -c factories/db/postgres/alembic.ini revision --autogenerate -m "..."
#
# The app reads this file too: PostgresProvider.setup_indexes() loads it and
# runs `upgrade head` over its own connection during the FastAPI lifespan.

[alembic]
# %(here)s is this file's directory, so neither of these depends on the cwd.
script_location = %(here)s/alembic

# src/ is the import root: env.py does `from utils.config import get_settings`
# and `from factories.db.postgres.base_repository import Base`, exactly as the
# application does. Three levels up from factories/db/postgres/ is src/.
prepend_sys_path = %(here)s/../../..

# Revisions are numbered by hand (0001, 0002, ...) rather than hashed, because
# this history is linear and `ls versions/` should read in order. New ones:
#   alembic -c ... revision --autogenerate --rev-id 0002 -m "add whatever"
file_template = %%(rev)s_%%(slug)s

# There is deliberately no `sqlalchemy.url` below, which is also why this file
# is safe to commit. env.py builds the DSN from POSTGRES_HOST/PORT/USER/
# PASSWORD/DB in src/.env, via Settings.postgres_async_url — one source of
# truth, and the credentials stay in the gitignored file. Setting a url here
# would be ignored by env.py anyway; keep it out so nothing tempts a password
# into the repository.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
