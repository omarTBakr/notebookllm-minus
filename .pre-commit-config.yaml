default_language_version:
  python: python3.12

repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: black --config src/pyproject.toml
        language: system
        types: [python]
        pass_filenames: true
      - id: ruff
        name: ruff
        entry: ruff check --config src/pyproject.toml --fix
        language: system
        types: [python]
        pass_filenames: true